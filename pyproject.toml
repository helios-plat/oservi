[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oservi"
version = "1.4.0"
description = "3O service assembly layer — engine skeletons + assembler (5th pillar of helios-plat)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Wiki", email = "wiki@helios-plat"}]
license = {text = "MIT"}
keywords = ["3o", "service", "assembly", "engine", "helios-plat"]

dependencies = [
    # 3O 四包依赖 — plain names; local editable installs take precedence
    "obase @ git+https://github.com/helios-plat/obase.git@a229627f96845ee5dccef9c8997241bd727f32ca",
    "oprim @ git+https://github.com/helios-plat/oprim.git@833243d7ca7087116606f70cdb88e8f1f631f260",
    "oskill @ git+https://github.com/helios-plat/oskill.git@8024bad8ded4e466d903f9fea2a53fa7e7db00fc",
    "omodul @ git+https://github.com/helios-plat/omodul.git@438f26fa8056586d92fc01ed358483562eb1a11f",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["oservi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
