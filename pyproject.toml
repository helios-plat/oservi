[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oservi"
version = "1.4.0"
description = "3O service assembly layer — engine skeletons + assembler (5th pillar of helios-plat)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Wiki", email = "wiki@helios-plat"}]
license = {text = "MIT"}
keywords = ["3o", "service", "assembly", "engine", "helios-plat"]

dependencies = [
    # 3O 四包依赖 — plain names; local editable installs take precedence
    "obase @ git+https://github.com/helios-plat/obase.git@7d31719d8411b4fb34952ae4098ab320625d14dd",
    "oprim @ git+https://github.com/helios-plat/oprim.git@e7f9c65196437d3bff09401aa02bc817d071eec3",
    "oskill @ git+https://github.com/helios-plat/oskill.git@96588d5520fbad257f6a28ff311b0c491fbf945e",
    "omodul @ git+https://github.com/helios-plat/omodul.git@5614fc5c6600e2b75d43d52a97721393b691eda6",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["oservi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
